<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101312" />
    <meta name="description" content="Journey – Your stories in games." />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/favicon.svg?v=journey-4" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon.ico?v=journey-4" sizes="48x48" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=journey-4" />
    <meta name="mobile-web-app-capable"                content="yes" />
    <meta name="apple-mobile-web-app-capable"          content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"            content="Journey" />

    <title>Journey</title>
    <link rel="stylesheet" href="journey.css?v=journey-4" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #101312; color: #e8e8f0; font-family: sans-serif; }
      #splash {
        position: fixed; inset: 0; background: #101312;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.4s;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-icon  { font-size: 64px; animation: pulse 1.5s ease-in-out infinite; }
      #splash-title { font-size: 28px; font-weight: 800; color: #e8e8f0; margin-top: 16px; }
      #splash-sub   { font-size: 14px; color: #5a5a72; margin-top: 8px; }
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
      #error-box {
        display: none; position: fixed; inset: 0; background: #101312;
        align-items: center; justify-content: center; flex-direction: column;
        padding: 24px; text-align: center; z-index: 99999;
      }
      #error-box.show { display: flex; }
      #error-box h2   { color: #ff6b6b; margin-bottom: 12px; font-size: 18px; }
      #error-box pre  {
        background: #1a1a24; padding: 16px; border-radius: 10px;
        font-size: 11px; color: #9090a8; text-align: left;
        max-width: 100%; overflow: auto; max-height: 300px;
        white-space: pre-wrap; word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img id="splash-logo" src="icons/icon.svg?v=journey-4" alt="" width="72" height="72" />
      <div id="splash-title">Journey</div>
      <div id="splash-sub">Loading…</div>
    </div>

    <div id="error-box">
      <h2>Unable to load</h2>
      <pre id="error-msg"></pre>
    </div>

    <div id="root"></div>

    <!-- Global error handler — must be first -->
    <script>
      function showError(msg) {
        var splash = document.getElementById('splash');
        var box    = document.getElementById('error-box');
        var pre    = document.getElementById('error-msg');
        if (splash) splash.classList.add('hidden');
        if (pre)    pre.textContent = msg;
        if (box)    box.classList.add('show');
      }
      window.onerror = function(msg, src, line, col, err) {
        showError('Error: ' + msg + '\nFile: ' + src + '\nLine: ' + line + ':' + col + (err ? '\n\n' + err.stack : ''));
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        showError('Promise error:\n' + (e.reason ? (e.reason.stack || String(e.reason)) : String(e)));
      });

      // Safety timeout
      setTimeout(function() {
        var root   = document.getElementById('root');
        var splash = document.getElementById('splash');
        if (root && !root.hasChildNodes() && splash && !splash.classList.contains('hidden')) {
          showError('The app did not load within 20 seconds.\nCheck the browser console for details.');
        }
      }, 20000);

      window.__hideSplash = function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 500); }
      };
    </script>

    <script src="vendor/react.min.js?v=journey-4"></script>
    <script src="vendor/react-dom.min.js?v=journey-4"></script>
    <script src="api.js?v=journey-4"></script>
    <script src="app.js?v=journey-4"></script>

    <!-- 4. Service Worker — registered after everything loads -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('sw.js')
            .then(function(r) { console.log('SW registrado:', r.scope); })
            .catch(function(e) { console.warn('Service worker unavailable:', e.message); });
        });
      }
    </script>
  </body>
</html>
