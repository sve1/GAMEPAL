<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d12" />
    <meta name="description" content="GamePal – Your intelligent AI gaming companion. Discover, organize and track your games." />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GamePal" />

    <!-- Open Graph -->
    <meta property="og:title" content="GamePal" />
    <meta property="og:description" content="Your intelligent AI gaming companion" />
    <meta property="og:type" content="website" />

    <title>GamePal 🎮</title>

    <style>
      /* Splash screen while React loads */
      #splash {
        position: fixed; inset: 0;
        background: #0d0d12;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.4s;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-icon { font-size: 64px; animation: pulse 1.5s ease-in-out infinite; }
      #splash-title {
        font-family: sans-serif; font-size: 28px; font-weight: 800;
        color: #e8e8f0; margin-top: 16px; letter-spacing: -0.5px;
      }
      #splash-sub { font-family: sans-serif; font-size: 14px; color: #5a5a72; margin-top: 8px; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-icon">🎮</div>
      <div id="splash-title">GamePal</div>
      <div id="splash-sub">Loading your gaming companion…</div>
    </div>

    <div id="root"></div>

    <!-- Babel + React from CDN (no build step needed!) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" src="app.js"></script>

    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW error:', err));
        });
      }

      // Hide splash once React mounts
      window.__hideSplash = () => {
        const s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(() => s.remove(), 400); }
      };
    </script>
  </body>
</html>
