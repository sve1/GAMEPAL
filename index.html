<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d12" />
    <meta name="description" content="GamePal – Seu assistente inteligente de jogos. Descubra, organize e acompanhe seus games." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Ícone padrão (navegador / Android fallback) -->
    <link rel="icon"          type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="icon"          type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="shortcut icon" type="image/png"                 href="icons/icon-192.png" />

    <!-- Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name"       content="GamePal" />

    <!-- iOS Safari -->
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />
    <meta name="apple-mobile-web-app-capable"          content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"            content="GamePal" />

    <!-- Open Graph -->
    <meta property="og:title"       content="GamePal" />
    <meta property="og:description" content="Seu assistente inteligente de jogos" />
    <meta property="og:type"        content="website" />
    <meta property="og:image"       content="icons/icon-512.png" />

    <title>GamePal 🎮</title>

    <style>
      #splash {
        position: fixed; inset: 0;
        background: #0d0d12;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.4s;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-icon  { font-size: 64px; animation: pulse 1.5s ease-in-out infinite; }
      #splash-title { font-family: sans-serif; font-size: 28px; font-weight: 800; color: #e8e8f0; margin-top: 16px; }
      #splash-sub   { font-family: sans-serif; font-size: 14px; color: #5a5a72; margin-top: 8px; }
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-icon">🎮</div>
      <div id="splash-title">GamePal</div>
      <div id="splash-sub">Carregando…</div>
    </div>

    <div id="root"></div>

    <!-- React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel Standalone 7 — with full preset-env (supports async/await, optional chaining, etc) -->
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

    <!-- Load app with env preset to support all modern JS -->
    <script type="text/babel" data-presets="env,react" data-plugins="transform-class-properties" src="app.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('sw.js')
            .then(function(r) { console.log('SW ok:', r.scope); })
            .catch(function(e) { console.log('SW erro:', e); });
        });
      }
      window.__hideSplash = function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 400); }
      };
    </script>
  </body>
</html>
